name: Touch Base CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'

      - name: Install Root Dependencies
        run: npm install

      - name: Verify Express Server Syntax
        run: |
          node -c server.js
          echo "Express server syntax check passed successfully."

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Engine Sanity Checks
        run: |
          python -c "import fastapi; import google.generativeai; print('Python serverless environment verified.')"
